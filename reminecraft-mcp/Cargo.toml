[package]
name = "reminecraft-mcp"
version = "0.1.0"
edition = "2021"
description = "Reminecraft MCP - AI agent bridge for Minecraft Java/Bedrock servers (Rust core)"

[[bin]]
name = "reminecraft-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }
azalea = { version = "0.16", default-features = false, features = ["serde", "packet-event", "online-mode"] }
eyre = "0.6"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
tokio-util = { version = "0.7", features = ["full"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
